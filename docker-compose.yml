services:
  dsh:
    build:
      context: .
      args:
        GITHUB_PROXY: socks5h://host.docker.internal:1080
        INSTALL_CODE_SERVER: "true"
        DSH_DEV_MODE: "false"
      extra_hosts:
        - "host.docker.internal:host-gateway"
    image: dsh-workbench:latest
    container_name: dsh-workbench
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3080"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./workspace:/workspace
      - deepseek-home:/home/deepseek
    working_dir: /opt/deepseek-harness

volumes:
  deepseek-home:
